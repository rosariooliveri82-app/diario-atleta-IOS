name: Build Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Genera cartella web
        run: flutter create . --project-name diario_atletica --org it.atletica --platforms=web
      - name: Imposta nome e icona app
        run: |
          sed -i 's/<title>.*<\/title>/<title>Diario Atletica<\/title>/' web/index.html
          sed -i 's/content="diario_atletica"/content="Diario Atletica"/g' web/index.html
          sed -i 's/"name": "diario_atletica"/"name": "Diario Atletica"/g' web/manifest.json
          sed -i 's/"short_name": "diario_atletica"/"short_name": "Diario Atletica"/g' web/manifest.json
          if [ -f icona.png ]; then
            cp icona.png web/favicon.png
            cp icona.png web/icons/Icon-192.png
            cp icona.png web/icons/Icon-512.png
            cp icona.png web/icons/Icon-maskable-192.png
            cp icona.png web/icons/Icon-maskable-512.png
          fi
      - run: flutter pub get
      - name: Compila per Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
